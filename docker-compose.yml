# Full stack: `docker compose up --build` → http://localhost:5173 (API via nginx at /api, Swagger at /api/docs).
# Local development only needs postgres: `docker compose up -d postgres` (see docs/developer-guide.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookworm
      POSTGRES_PASSWORD: bookworm
      POSTGRES_DB: bookworm
    ports:
      # Override when 5432 is taken by a local PostgreSQL: POSTGRES_PORT=5433 docker compose up
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookworm -d bookworm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bookworm:bookworm@postgres:5432/bookworm?schema=public
      # Demo default only — set JWT_SECRET in the environment for anything shared or public.
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0f4c2b7e9a1d}
      JWT_EXPIRES_IN: 7d
      JWT_GUEST_EXPIRES_IN: 24h
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      PAYMENT_ALWAYS_SUCCESS: "true"
      BCRYPT_ROUNDS: 12
      TRUST_PROXY: 1
      RATE_LIMIT_LOOKUP_MAX: 10
      SWEEPER_INTERVAL_MS: 60000
      SEED_ON_START: "true"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
