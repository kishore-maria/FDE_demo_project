openapi: 3.0.3
info:
  title: BookWorm API
  version: 1.0.0
  description: |
    REST API for **BookWorm**, an e-bookstore where guests and registered users browse, buy and track books.

    **Conventions**
    - Money is stored as integer **paise**. Every money field is returned twice: `xxxPaise` (integer) and `xxxInr` (formatted, e.g. `₹149`).
    - Errors always look like `{ "error": { "code", "message", "details" } }`.
    - Paginated lists look like `{ "items", "page", "pageSize", "total", "totalPages" }`.
    - Authenticate with `Authorization: Bearer <token>` from `/auth/login`, `/auth/register` or `/auth/guest-session`.
    - Guest tokens (role `GUEST`) only work for cart, checkout and payment of orders placed in the same guest session.

    Demo accounts: `customer@test.com / Test@1234`, `admin@bookworm.com / Admin@1234`.
  contact:
    name: BookWorm Team
    email: admin@bookworm.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api
    description: Local development
  - url: /api
    description: Same origin (Docker / nginx)

security:
  - BearerAuth: []

tags:
  - name: System
    description: Health and diagnostics
  - name: Auth
    description: Registration, login, guest sessions and profile (Member)
  - name: Users
    description: Saved delivery addresses
  - name: Catalog
    description: Categories, publishers (brands), books, reviews and recommendations
  - name: Authors
    description: Authors and the My Writers follow system
  - name: Cart
    description: Shopping cart
  - name: Wishlist
    description: Saved books
  - name: Coupons
    description: Coupon validation
  - name: Orders
    description: Checkout, order history, cancel, return and guest order tracking
  - name: Payments
    description: Mock payment processing and wallet
  - name: Shipments
    description: Shipment tracking and shipping rates
  - name: Store
    description: Store information and policies
  - name: Admin
    description: Store, catalog, coupon and order management (ADMIN only)

paths:
  # ───────────────────────────── System ─────────────────────────────
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ───────────────────────────── Auth ─────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/guest-session:
    post:
      tags: [Auth]
      operationId: createGuestSession
      summary: Start a guest checkout session with just an email
      description: |
        Returns a 24h guest token. Fails with `409 ACCOUNT_EXISTS` if the email belongs to a registered account
        (the user must log in instead). Each call starts a new guest session (`gsid`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSessionRequest' }
      responses:
        '200':
          description: Guest session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/profile:
    get:
      tags: [Auth]
      operationId: getProfile
      summary: Get the current user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      operationId: updateProfile
      summary: Update name or phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/set-password:
    put:
      tags: [Auth]
      operationId: setPassword
      summary: Convert a guest into a registered customer
      description: |
        Guest token required. Only allowed when the guest placed at least one order in the current guest session.
        Keeps the same user id, so all previous orders stay visible in My Orders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '200':
          description: Account converted; new 7-day token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── Users ─────────────────────────────
  /users/me/addresses:
    get:
      tags: [Users]
      operationId: listAddresses
      summary: List my saved addresses
      responses:
        '200':
          description: Saved addresses (default first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createAddress
      summary: Save a new address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Address saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Users]
      operationId: updateAddress
      summary: Update a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      operationId: deleteAddress
      summary: Delete a saved address
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Users]
      operationId: setDefaultAddress
      summary: Make an address the default
      responses:
        '200':
          description: Address is now the default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Catalog ─────────────────────────────
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Category tree (Fiction / Non-Fiction → genres)
      description: Top-level groups with their child genres. Sidebar genres have `showInSidebar = true`.
      security: []
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }

  /publishers:
    get:
      tags: [Catalog]
      operationId: listPublishers
      summary: List publishers (brands)
      security: []
      responses:
        '200':
          description: Publishers with book counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Publisher' }

  /publishers/{publisherId}:
    parameters:
      - $ref: '#/components/parameters/PublisherId'
    get:
      tags: [Catalog]
      operationId: getPublisher
      summary: Publisher details
      security: []
      responses:
        '200':
          description: Publisher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publisher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /books:
    get:
      tags: [Catalog]
      operationId: listBooks
      summary: Browse, search, filter and sort books
      security: [{}, { BearerAuth: [] }]
      parameters:
        - name: category
          in: query
          description: Category slug. Parent categories include their child genres.
          schema: { $ref: '#/components/schemas/Slug' }
          example: self-help
        - name: publisher
          in: query
          description: Publisher slug ("Browse the brands")
          schema: { $ref: '#/components/schemas/Slug' }
          example: abc-publishers
        - name: author
          in: query
          description: Author slug
          schema: { $ref: '#/components/schemas/Slug' }
          example: daniel-reed
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/BookFormat' }
        - name: language
          in: query
          schema: { type: string, maxLength: 40 }
          example: English
        - name: minPrice
          in: query
          description: Minimum price in paise
          schema: { type: integer, minimum: 0 }
          example: 10000
        - name: maxPrice
          in: query
          description: Maximum price in paise
          schema: { type: integer, minimum: 0 }
          example: 40000
        - name: search
          in: query
          description: Case-insensitive match on title, author or publisher
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: minimalism
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, newest]
            default: relevance
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /books/recommended:
    get:
      tags: [Catalog]
      operationId: getRecommendedBooks
      summary: Recommended for You
      description: |
        Personalised for registered users with order history (`source = personalised`);
        otherwise editor's picks (`source = editors_pick`).
      security: [{}, { BearerAuth: [] }]
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }

  /books/bestsellers:
    get:
      tags: [Catalog]
      operationId: getBestsellers
      summary: Bestsellers (top 12 by copies sold)
      security: []
      responses:
        '200':
          description: Bestselling books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookCollection' }

  /books/new-launches:
    get:
      tags: [Catalog]
      operationId: getNewLaunches
      summary: New launches (12 most recently published)
      security: []
      responses:
        '200':
          description: Newest books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookCollection' }

  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Catalog]
      operationId: getBook
      summary: Book details with reviews, related reads, up-sell and cross-sell
      security: [{}, { BearerAuth: [] }]
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /books/{bookId}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookId'
    post:
      tags: [Catalog]
      operationId: upsertReview
      summary: Add or replace my review (registered users only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Review saved; book rating recalculated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Authors ─────────────────────────────
  /authors:
    get:
      tags: [Authors]
      operationId: listAuthors
      summary: List authors (includes isFollowing when logged in)
      security: [{}, { BearerAuth: [] }]
      responses:
        '200':
          description: Authors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Author' }

  /authors/following:
    get:
      tags: [Authors]
      operationId: listFollowedAuthors
      summary: Authors I follow (My Writers → Your Writers)
      responses:
        '200':
          description: Followed authors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Author' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /authors/following/new-releases:
    get:
      tags: [Authors]
      operationId: listNewReleasesFromFollowed
      summary: Newest books from authors I follow (up to 12)
      responses:
        '200':
          description: New releases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /authors/suggestions:
    get:
      tags: [Authors]
      operationId: listAuthorSuggestions
      summary: Discover Writers — authors in genres I buy, not yet followed
      responses:
        '200':
          description: Suggested authors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Author' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /authors/{authorId}:
    parameters:
      - $ref: '#/components/parameters/AuthorId'
    get:
      tags: [Authors]
      operationId: getAuthor
      summary: Author profile with books
      security: [{}, { BearerAuth: [] }]
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /authors/{authorId}/follow:
    parameters:
      - $ref: '#/components/parameters/AuthorId'
    post:
      tags: [Authors]
      operationId: followAuthor
      summary: Follow an author
      responses:
        '201':
          description: Now following
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Authors]
      operationId: unfollowAuthor
      summary: Unfollow an author
      responses:
        '200':
          description: No longer following
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Cart ─────────────────────────────
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get my cart
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Remove everything from my cart
      responses:
        '200':
          description: Empty cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a book (adds to the existing quantity)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /cart/items/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Set the quantity of a book (0 removes it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove a book from my cart
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cart/merge:
    post:
      tags: [Cart]
      operationId: mergeCart
      summary: Merge the anonymous browser cart into my server cart
      description: Called right after login, register or guest-session. Quantities are summed and capped at stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartMergeRequest' }
      responses:
        '200':
          description: Merged cart plus any skipped items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartWithSkipped' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cart/buy-again/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Cart]
      operationId: buyAgain
      summary: Add the books from a past order to my cart
      responses:
        '200':
          description: Updated cart plus any out-of-stock items that were skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartWithSkipped' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Wishlist ─────────────────────────────
  /wishlist:
    get:
      tags: [Wishlist]
      operationId: getWishlist
      summary: My wishlist
      responses:
        '200':
          description: Wishlisted books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Wishlist]
      operationId: addToWishlist
      summary: Add a book (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddWishlistRequest' }
      responses:
        '200':
          description: Book is in the wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishlist/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: Remove a book from my wishlist
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Coupons ─────────────────────────────
  /coupons/validate:
    post:
      tags: [Coupons]
      operationId: validateCoupon
      summary: Check a coupon against a cart subtotal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponValidateRequest' }
      responses:
        '200':
          description: Validation result (invalid coupons return valid=false with a reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponValidateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Orders ─────────────────────────────
  /orders/checkout:
    post:
      tags: [Orders]
      operationId: checkout
      summary: Create a PENDING order from my cart and reserve stock for 30 minutes
      description: |
        Provide either `addressId` (saved address) or `address` (typed in). The cart is not cleared and the coupon
        and gift points are not consumed until payment succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created and stock reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: My order history (newest first)
      parameters:
