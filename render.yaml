# Render Blueprint — one free web service (API + built web app) backed by a Neon PostgreSQL database.
# Setup steps: docs/developer-guide.md#deploy-to-render--neon-free
services:
  - type: web
    name: bookworm
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Neon *direct* (non-pooled) connection string, entered in the Render dashboard on first sync.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_GUEST_EXPIRES_IN
        value: 24h
      - key: PAYMENT_ALWAYS_SUCCESS
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_LOOKUP_MAX
        value: "10"
      - key: SWEEPER_INTERVAL_MS
        value: "60000"
      # Seed demo data only into an empty database, so free-tier restarts keep reviewers' changes.
      - key: SEED_ON_START
        value: if-empty
